[settings]
lockfile = true

# The Minestom `data` version the pinned SteelMC (Cargo.toml) is built against.
# When this version differs from the Minestom version, block state and biome IDs are converted before being sent over the wire.
[vars]
minecraft_data_from = "26.2-rv3"

[tools]
"cargo:cargo-zigbuild" = "0.23.0"
gradle = "9.6"
java = "25"
rust = { version = "nightly-2026-08-21", targets = ["x86_64-unknown-linux-musl"] }
zig = "0.16.0"

[tasks.compile-rust]
#sources = ["steel-provider/src/**", "steel-provider/Cargo.lock", "steel-provider/Cargo.toml"]
usage = '''
flag "-r --release" default=#false help="Compile the Rust crate in release mode"
flag "-s --static" default=#false help="Cross-compile a statically linked x86_64-unknown-linux-musl binary"
'''
depends = ["minecraft-data"]
outputs = []
dir = "steel-provider"
run = """
set -eu
# Data-jar paths resolved by `minecraft-data` (block/biome registry data).
. ../java-client/minestom/build/minecraft-data.env
export MINESTOM_DATA_FROM_JAR MINESTOM_DATA_TO_JAR
{% if usage.static %}
cargo zigbuild{{ ' --release' if usage.release else '' }} --target x86_64-unknown-linux-musl
{% else %}
cargo build{{ ' --release' if usage.release else '' }}
{% endif %}
"""

# Resolves the net.minestom:data jars that steel-provider's build script reads
# its block and biome registries from, and writes their paths to
# java-client/minestom/build/minecraft-data.env for `compile-rust`. Must run
# before `compile-rust`.
[tasks.minecraft-data]
description = "Resolve net.minestom:data jars for the SteelMC and client data versions"
dir = "java-client"
run = "gradle :minestom:resolveMinecraftData --no-configuration-cache -PminecraftDataFromVersion={{ vars.minecraft_data_from }}"

[tasks.build]
#sources = ["java-client/bridge/**/*", "java-client/minestom/**/*", "java-client/demo/**/*", "java-client/gradlew", "java-client/gradlew.bat", "java-client/gradle.properties", "java-client/settings.gradle.kts", "java-client/gradle/**/*"]
usage = '''
flag "-r --release" default=#false help="Build with the Rust binary compiled in release mode"
flag "-s --static" default=#false help="Bundle the statically linked musl binary"
'''
depends = ["compile-rust{{ ' --release' if usage.release else '' }}{{ ' --static' if usage.static else '' }}"]
dir = "java-client"
run = "gradle build -x test -PsteelProvider=../steel-provider/{{ 'target/x86_64-unknown-linux-musl' if usage.static else 'target' }}/{{ 'release' if usage.release else 'debug' }}/steel-provider"

[tasks.clean-rust]
dir = "steel-provider"
run = "cargo clean"

[tasks.clean-java]
dir = "java-client"
run = "gradle clean && rm -rf .gradle build"

[tasks.clean]
depends = ["clean-rust", "clean-java", "clean-bench"]

[tasks.build-demo]
usage = '''
flag "-s --static" default=#false help="Bundle the statically linked musl binary"
'''
depends = ["compile-rust{{ ' --static' if usage.static else '' }}"]
dir = "java-client"
run = "gradle :demo:build -PsteelProvider=../steel-provider/{{ 'target/x86_64-unknown-linux-musl' if usage.static else 'target' }}/debug/steel-provider"

[tasks.demo]
usage = '''
flag "-r --release" default=#false help="Run the demo against the release binary"
flag "-s --static" default=#false help="Use the statically linked musl binary"
'''
depends = ["compile-rust{{ ' --release' if usage.release else '' }}{{ ' --static' if usage.static else '' }}"]
dir = "java-client"
run = "gradle :demo:run -PsteelProvider=../steel-provider/{{ 'target/x86_64-unknown-linux-musl' if usage.static else 'target' }}/{{ 'release' if usage.release else 'debug' }}/steel-provider"

[tasks.test-rust]
usage = '''
flag "-r --release" default=#false help="Run the Rust tests in release mode"
flag "-s --static" default=#false help="Also cross-compile the statically linked musl binary (tests still run natively)"
'''
outputs = []
depends = ["compile-rust{{ ' --release' if usage.release else '' }}{{ ' --static' if usage.static else '' }}"]
dir = "steel-provider"
run = "cargo test{{ ' --release' if usage.release else '' }}"

[tasks.test-java]
usage = '''
flag "-r --release" default=#false help="Run the Java tests against the release binary"
flag "-s --static" default=#false help="Test against the statically linked musl binary"
'''
outputs = []
depends = ["compile-rust{{ ' --release' if usage.release else '' }}{{ ' --static' if usage.static else '' }}"]
dir = "java-client"
run = "gradle test -PsteelProvider=../steel-provider/{{ 'target/x86_64-unknown-linux-musl' if usage.static else 'target' }}/{{ 'release' if usage.release else 'debug' }}/steel-provider"

[tasks.test]
usage = '''
flag "-r --release" default=#false help="Run all tests in release mode"
flag "-s --static" default=#false help="Build/test against the statically linked musl binary"
'''
depends = ["test-rust{{ ' --release' if usage.release else '' }}{{ ' --static' if usage.static else '' }}"]
depends_post = ["test-java{{ ' --release' if usage.release else '' }}{{ ' --static' if usage.static else '' }}"]

[tasks.publish]
dir = "java-client"
depends = ["build --release --static"]
run = "gradle publish -PsteelProvider=../steel-provider/target/x86_64-unknown-linux-musl/release/steel-provider -PreposiliteUsername=\"$REPOSILITE_USERNAME\" -PreposilitePassword=\"$REPOSILITE_TOKEN\""

[tasks.publishToMavenLocal]
dir = "java-client"
depends = ["build --release --static"]
run = "gradle publishToMavenLocal -PsteelProvider=../steel-provider/target/x86_64-unknown-linux-musl/release/steel-provider"

[tasks.steel-checkout]
description = "Ensure a SteelMC checkout at the rev pinned in steel-provider/Cargo.toml exists with target/release/steel built"
usage = '''
flag "-f --force" default=#false help="Fetch origin even if HEAD already matches the pinned rev"
'''
env = { STEEL_URL = "https://github.com/Steel-Foundation/SteelMC" }
dir = "."
run = """
set -eu

REV="$(sed -n 's/.*rev = "\\([0-9a-f]\\{40\\}\\)".*/\\1/p' steel-provider/Cargo.toml | head -1)"
[ -n "$REV" ] || { echo "error: no rev pin found in steel-provider/Cargo.toml" >&2; exit 1; }

TARGET="${STEEL_REPO:-${PWD}/benchmark/.steel}"
echo "==> Ensuring SteelMC checkout at $TARGET pinned to $REV"

if [ ! -d "$TARGET/.git" ]; then
  echo "==> Cloning $STEEL_URL"
  mkdir -p "$(dirname "$TARGET")"
  git clone "$STEEL_URL" "$TARGET"
elif [ "$(git -C "$TARGET" rev-parse HEAD 2>/dev/null)" != "$REV" ] || [ "{{ usage.force }}" = true ]; then
  echo "==> Fetching origin"
  git -C "$TARGET" fetch origin
fi

# Guarantee the pinned rev's object is present, then check it out detached.
if [ "$(git -C "$TARGET" rev-parse HEAD 2>/dev/null)" != "$REV" ]; then
  git -C "$TARGET" fetch origin "$REV"
  git -C "$TARGET" checkout --detach "$REV"
fi

echo "==> Building steel (release)"
( cd "$TARGET" && cargo build --release -p steel )

echo "==> Steel binary: $TARGET/target/release/steel (@ $(git -C "$TARGET" rev-parse --short HEAD))"
"""

[tasks.build-bench]
description = "Compile the Rust benchmark harness (benchmark/)"
dir = "benchmark"
run = "cargo build --release"

[tasks.clean-bench]
run = "rm -rf benchmark/.fabric-cache benchmark/.fabric-server benchmark/results benchmark/target"

[tasks.bench]
description = "Run the full cold-world benchmark suite (Steel, Fabric, steel-provider, Minestom) and print a summary"
depends = ["steel-checkout", "build-bench"]
env = { PREGEN_WINDOW_SIZE = "64" }
# Customize via env: PROFILE, SIDE, RUNS, WORKERS, STEEL_REPO, FABRIC_DIR,
# OUTPUT, SAMPLE_MS, COOLDOWN (defaults in benchmark/src/main.rs).
run = "benchmark/target/release/bench-tool"
