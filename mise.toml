[settings]
lockfile = true

[tools]
"cargo:cargo-zigbuild" = "0.23.0"
gradle = "9.6"
java = "25"
rust = "nightly-2026-07-23"
zig = "0.16.0"

[tasks.compile-rust]
#sources = ["steel-provider/src/**", "steel-provider/Cargo.lock", "steel-provider/Cargo.toml"]
usage = '''
flag "-r --release" default=#false help="Compile the Rust crate in release mode"
flag "-s --static" default=#false help="Cross-compile a statically linked x86_64-unknown-linux-musl binary"
'''
outputs = []
dir = "steel-provider"
run = """
{% if usage.static %}
rustup target add x86_64-unknown-linux-musl
cargo zigbuild{{ ' --release' if usage.release else '' }} --target x86_64-unknown-linux-musl
{% else %}
cargo build{{ ' --release' if usage.release else '' }}
{% endif %}
"""

[tasks.copy-binary]
usage = '''
flag "-r --release" default=#false help="Copy the release steel-provider executable to the Java resources"
flag "-s --static" default=#false help="Copy the statically linked musl executable"
'''
outputs = []
depends = ["compile-rust{{ ' --release' if usage.release else '' }}{{ ' --static' if usage.static else '' }}"]
run = """
mkdir -p java-client/lib/src/main/resources/native
mkdir -p java-client/lib/src/main/resources/META-INF
PROFILE="{{ 'release' if usage.release else 'debug' }}"
TARGET_DIR="{{ 'target/x86_64-unknown-linux-musl' if usage.static else 'target' }}"
cp -fv "steel-provider/${TARGET_DIR}/${PROFILE}/steel-provider" java-client/lib/src/main/resources/native/steel-provider
cp -fv "steel-provider/LICENSE-AGPL" java-client/lib/src/main/resources/META-INF/LICENSE-AGPL.txt
chmod +x java-client/lib/src/main/resources/native/steel-provider
"""

[tasks.build]
#sources = ["java-client/lib/**/*", "java-client/gradlew", "java-client/gradlew.bat", "java-client/gradle.properties", "java-client/settings.gradle.kts", "java-client/gradle/**/*"]
usage = '''
flag "-r --release" default=#false help="Build with the Rust binary compiled in release mode"
flag "-s --static" default=#false help="Bundle the statically linked musl binary"
'''
depends = ["copy-binary{{ ' --release' if usage.release else '' }}{{ ' --static' if usage.static else '' }}"]
dir = "java-client"
run = "gradle build -x test"

[tasks.clean-rust]
dir = "steel-provider"
run = "cargo clean"

[tasks.clean-java]
dir = "java-client"
run = "gradle clean && rm -rf .gradle build"

[tasks.clean]
depends = ["clean-rust", "clean-java"]

[tasks.build-demo]
usage = '''
flag "-s --static" default=#false help="Bundle the statically linked musl binary"
'''
depends = ["copy-binary{{ ' --static' if usage.static else '' }}"]
dir = "java-client"
run = "gradle :demo:build"

[tasks.demo]
usage = '''
flag "-r --release" default=#false help="Run the demo against the release binary"
flag "-s --static" default=#false help="Use the statically linked musl binary"
'''
depends = ["copy-binary{{ ' --release' if usage.release else '' }}{{ ' --static' if usage.static else '' }}"]
dir = "java-client"
run = "gradle :demo:run"

[tasks.test-rust]
usage = '''
flag "-r --release" default=#false help="Run the Rust tests in release mode"
flag "-s --static" default=#false help="Also cross-compile the statically linked musl binary (tests still run natively)"
'''
outputs = []
depends = ["compile-rust{{ ' --release' if usage.release else '' }}{{ ' --static' if usage.static else '' }}"]
dir = "steel-provider"
run = "cargo test{{ ' --release' if usage.release else '' }}"

[tasks.test-java]
usage = '''
flag "-r --release" default=#false help="Run the Java tests against the release binary"
flag "-s --static" default=#false help="Test against the statically linked musl binary"
'''
outputs = []
depends = ["copy-binary{{ ' --release' if usage.release else '' }}{{ ' --static' if usage.static else '' }}"]
dir = "java-client"
run = "gradle test"

[tasks.test]
usage = '''
flag "-r --release" default=#false help="Run all tests in release mode"
flag "-s --static" default=#false help="Build/test against the statically linked musl binary"
'''
depends = ["test-rust{{ ' --release' if usage.release else '' }}{{ ' --static' if usage.static else '' }}"]
depends_post = ["test-java{{ ' --release' if usage.release else '' }}{{ ' --static' if usage.static else '' }}"]

[tasks.publish]
dir = "java-client"
depends = ["build --release --static"]
run = "gradle publish -PreposiliteUsername=\"$REPOSILITE_USERNAME\" -PreposilitePassword=\"$REPOSILITE_TOKEN\""

[tasks.publishToMavenLocal]
dir = "java-client"
depends = ["build --release --static"]
run = "gradle publishToMavenLocal"
